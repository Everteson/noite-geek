<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1C"/>
      <stop offset="0.6" stop-color="#1A1533"/>
      <stop offset="1" stop-color="#2B1838"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1B4A"/>
      <stop offset="0.55" stop-color="#B0507A"/>
      <stop offset="1" stop-color="#FF9A4A"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2450"/>
      <stop offset="1" stop-color="#0F1222"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7A1A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="78" y="70" width="300" height="168" rx="10"/></clipPath>
    <pattern id="stars" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#3A4466"/>
      <circle cx="24" cy="22" r="0.8" fill="#2C3552"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#stars)" opacity="0.8"/>
  <circle cx="228" cy="160" r="190" fill="url(#glow)"/>

  <!-- TV com a cena do porto -->
  <rect x="66" y="58" width="324" height="192" rx="16" fill="#05070F" stroke="#2C3552" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="78" y="70" width="300" height="168" fill="url(#sky)"/>
    <circle cx="300" cy="150" r="20" fill="#FFD27A" opacity="0.9"/>
    <rect x="78" y="168" width="300" height="70" fill="url(#water)"/>
    <g fill="#120E22">
      <rect x="92" y="138" width="14" height="30"/><rect x="108" y="126" width="10" height="42"/>
      <rect x="120" y="146" width="18" height="22"/><rect x="140" y="132" width="9" height="36"/>
      <rect x="151" y="150" width="16" height="18"/>
    </g>
    <g stroke="#FF7A1A" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M236 168 V112 M228 112 H282 M236 120 L266 112 M276 112 V128"/>
      <path d="M326 168 V122 M318 122 H366 M326 130 L352 122 M360 122 V136"/>
    </g>
    <!-- atalhos -->
    <g>
      <rect x="92" y="200" width="44" height="22" rx="6" fill="#F47521" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="142" y="200" width="22" height="22" rx="6" fill="#F2F2F2"/>
      <rect x="170" y="200" width="22" height="22" rx="6" fill="#9146FF"/>
      <rect x="198" y="200" width="22" height="22" rx="6" fill="#141414"/>
      <rect x="226" y="200" width="22" height="22" rx="6" fill="#1DB954"/>
      <rect x="254" y="200" width="22" height="22" rx="6" fill="#1A98FF"/>
    </g>
  </g>
  <rect x="198" y="250" width="60" height="10" rx="3" fill="#1A2033"/>
  <rect x="168" y="260" width="120" height="6" rx="3" fill="#1A2033"/>

  <!-- título -->
  <text x="450" y="150" fill="#F2F4FA" font-family="Outfit, Inter, 'Segoe UI', system-ui, sans-serif" font-size="80" font-weight="700" letter-spacing="-1">Noite <tspan fill="#FF7A1A">Geek</tspan></text>
  <text x="454" y="200" fill="#B8C2D6" font-family="Outfit, Inter, 'Segoe UI', system-ui, sans-serif" font-size="27" font-weight="500">Uma tela inicial só sua pra Android TV, leve e bonita.</text>
  <text x="454" y="238" fill="#FF9A4A" font-family="Outfit, Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="600" letter-spacing="3">ANDROID TV  ·  YOUTUBE  ·  CRUNCHYROLL  ·  ARTE POR HORÁRIO</text>

  <rect x="454" y="272" width="760" height="4" rx="2" fill="#FF7A1A" opacity="0.85"/>
</svg>
